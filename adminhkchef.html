<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Admin | Top Eletrônica</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
 font-family:Arial;
 background:#f2f2f2;
 padding:20px
}
.box{
 max-width:400px;
 background:#fff;
 margin:auto;
 padding:20px;
 border-radius:10px
}
input,textarea,button{
 width:100%;
 padding:10px;
 margin-top:10px
}
button{
 background:#111;
 color:#fff;
 border:0;
 cursor:pointer
}
</style>
</head>

<body>

<div class="box">
<h3>Painel Admin</h3>

<input id="titulo" placeholder="Título">
<input id="subtitulo" placeholder="Subtítulo">
<input id="valor" placeholder="Valor">
<textarea id="codigo" placeholder="Código Pix"></textarea>
<input id="validade" placeholder="Validade">

<button onclick="salvar()">Salvar</button>
</div>

<script>
const API='https://pix-site-api.onrender.com/api/pix';
const SENHA='001533';

async function salvar(){
 await fetch(API,{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
   senha:SENHA,
   dados:{
    titulo:titulo.value,
    subtitulo:subtitulo.value,
    valor:valor.value,
    codigo:codigo.value,
    validade:validade.value
   }
  })
 });
 alert('Atualizado com sucesso');
}
</script>

</body>
</html>
