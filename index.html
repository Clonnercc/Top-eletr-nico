<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagamento Pix | Top Eletrônica</title>

<style>
body{margin:0;font-family:system-ui;background:#f2f2f2}
.hidden{display:none}
.top{background:#2db36c;color:#fff;padding:30px 20px;text-align:center}
.card{background:#fff;border-radius:12px;padding:20px;margin:20px;box-shadow:0 10px 25px rgba(0,0,0,.1)}
input,button{width:100%;padding:12px;margin-top:10px;font-size:14px}
button{border:0;border-radius:8px;background:#1c9bd6;color:#fff}
.code{background:#f4f4f4;padding:12px;border-radius:6px;font-size:12px;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center}
.modal .box{background:#fff;border-radius:12px;padding:20px;max-width:340px}
</style>
</head>

<body>

<div class="top">
  <h2 id="titulo">Falta pouco!</h2>
  <p id="subtitulo">Copie e cole o código Pix</p>
</div>

<div class="card">
  <div>Valor do Pix:</div>
  <div id="valor" style="font-size:22px;font-weight:700"></div>

  <div style="margin-top:10px">Código Pix:</div>
  <div class="code" id="codigo"></div>

  <button onclick="copiar()">Copiar código</button>
  <p id="validade" style="font-size:12px;color:#777"></p>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3>Código copiado</h3>
    <ol>
      <li>Abra o app do banco</li>
      <li>Pix → Copia e Cola</li>
      <li>Cole o código</li>
      <li>Confirme</li>
    </ol>
    <button onclick="modal.style.display='none'">Entendi</button>
  </div>
</div>

<script>
const API='https://pix-site-api.onrender.com/api/pix';
let PIX='';

async function carregar(){
  const r=await fetch(API,{cache:'no-store'});
  const d=await r.json();
  titulo.innerText=d.titulo;
  subtitulo.innerText=d.subtitulo;
  valor.innerText=d.valor;
  codigo.innerText=d.codigo;
  validade.innerText=d.validade;
  PIX=d.codigo;
}
carregar();
setInterval(carregar,5000);

function copiar(){
  navigator.clipboard.writeText(PIX).then(()=>{
    modal.style.display='grid';
  });
}
</script>

</body>
</html>
