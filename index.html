<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pagamento Pix | Top Eletrônica</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f3f6
}
header{
  background:#111;
  color:#fff;
  padding:20px;
  text-align:center
}
.container{
  max-width:420px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.1)
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  font-size:14px
}
button{
  background:#2db36c;
  color:#fff;
  border:0;
  border-radius:6px;
  cursor:pointer
}
.code{
  background:#eee;
  padding:12px;
  border-radius:6px;
  word-break:break-all;
  font-size:13px
}
.hidden{display:none}
footer{
  text-align:center;
  font-size:12px;
  color:#555;
  margin:20px
}
</style>
</head>

<body>

<header>
<h2>Top Eletrônica</h2>
<p>Pagamento rápido e seguro via Pix</p>
</header>

<div class="container" id="form">
<input id="nome" placeholder="Nome completo">
<input id="telefone" placeholder="WhatsApp">
<input id="cpf" placeholder="CPF">
<input id="endereco" placeholder="Endereço completo">
<button onclick="continuar()">Continuar</button>
</div>

<div class="container hidden" id="pix">
<h3 id="titulo"></h3>
<p id="subtitulo"></p>
<strong id="valor"></strong>

<p>Código Pix:</p>
<div class="code" id="codigo"></div>

<button onclick="copiar()">Copiar código</button>
</div>

<footer>
© Top Eletrônica – Todos os direitos reservados
</footer>

<script>
const API='https://pix-site-api.onrender.com/api/pix';
const WHATS='5516997867250';
let PIX='';

async function carregar(){
 const r=await fetch(API);
 const d=await r.json();
 titulo.innerText=d.titulo;
 subtitulo.innerText=d.subtitulo;
 valor.innerText=d.valor;
 codigo.innerText=d.codigo;
 PIX=d.codigo;
}
carregar();

function continuar(){
 if(!nome.value||!telefone.value||!cpf.value||!endereco.value){
  alert('Preencha todos os campos');
  return;
 }
 form.classList.add('hidden');
 pix.classList.remove('hidden');
}

function copiar(){
 navigator.clipboard.writeText(PIX);
 const msg=`Olá! Fiz um pedido na Top Eletrônica.
Nome: ${nome.value}
Telefone: ${telefone.value}
Endereço: ${endereco.value}
Valor: ${valor.innerText}`;
 window.location.href=`https://wa.me/${WHATS}?text=${encodeURIComponent(msg)}`;
}
</script>

</body>
</html>
